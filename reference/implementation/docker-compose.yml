services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agent_pay
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../specs/v1/database-schema.sql:/docker-entrypoint-initdb.d/010-base-schema.sql:ro
      - ../../specs/v1/migrations/001_stage4_convergence.sql:/docker-entrypoint-initdb.d/020-stage4-convergence.sql:ro
      - ../../specs/v1/migrations/002_ledger_accounts.sql:/docker-entrypoint-initdb.d/030-ledger-accounts.sql:ro
      - ../../specs/v1/migrations/003_execution_integrity.sql:/docker-entrypoint-initdb.d/040-execution-integrity.sql:ro
      - ../../specs/v1/migrations/004_control_binding.sql:/docker-entrypoint-initdb.d/050-control-binding.sql:ro
      - ../../specs/v1/migrations/005_reconciliation_integrity.sql:/docker-entrypoint-initdb.d/060-reconciliation-integrity.sql:ro
      - ../../specs/v1/migrations/006_payment_lifecycle.sql:/docker-entrypoint-initdb.d/070-payment-lifecycle.sql:ro
      - ../../specs/v1/migrations/007_settlement_reconciliation_integrity.sql:/docker-entrypoint-initdb.d/080-settlement-reconciliation-integrity.sql:ro
      - ../../specs/v1/migrations/008_reconciliation_multiple_settlements.sql:/docker-entrypoint-initdb.d/090-reconciliation-multiple-settlements.sql:ro
      - ../../specs/v1/migrations/009_payment_instrument_integrity.sql:/docker-entrypoint-initdb.d/100-payment-instrument-integrity.sql:ro
      - ../../specs/v1/migrations/010_batch2_audit_notification_security.sql:/docker-entrypoint-initdb.d/110-batch2-audit-notification-security.sql:ro
      - ../../specs/v1/migrations/011_authorization_evidence_integrity.sql:/docker-entrypoint-initdb.d/120-authorization-evidence-integrity.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agent_pay"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/agent_pay
      AGENT_PAY_AUTH_MODE: development
      AGENT_PAY_DEV_TOKEN: local-agent-token
      AGENT_PAY_APPROVAL_TOKEN: local-approval-token
      AGENT_PAY_APPROVAL_ACTOR: local-user
      AGENT_PAY_PROVIDER_WEBHOOK_SECRET: local-provider-secret
      AGENT_PAY_DEV_AGENT_ID: 00000000-0000-0000-0000-000000000001
      AGENT_PAY_DEV_ACCOUNT_ID: 00000000-0000-0000-0000-000000000002
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: .
    command: ["sh", "-c", "while true; do python -m agent_pay.worker_runner; sleep 2; done"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/agent_pay
      AGENT_PAY_MOCK_OUTCOME: SUCCEEDED
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
