[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-pay-reference"
version = "0.5.0"
description = "Reference implementation for the Agent-Pay protocol"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.8,<3",
  "psycopg[binary]>=3.2,<4",
  "PyJWT[crypto]>=2.9,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "httpx>=0.27,<1", "PyYAML>=6,<7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
