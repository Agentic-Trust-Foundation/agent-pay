openapi: 3.0.3
info:
  title: Agent-Pay API
  version: 1.0.0
  description: Financial control and payment API for AI agents. The API accepts financial intent; Agent-Pay evaluates authenticated agent identity, delegation, policy, budget, approval, authentication, and payment routing.
servers:
  - url: https://api.example.invalid/v1
security:
  - agentBearer: []
tags: [{name: Agents}, {name: Delegations}, {name: Wallets}, {name: Policies}, {name: Payments}, {name: Approvals}, {name: Transactions}]
paths:
  /agents:
    post:
      tags: [Agents]
      operationId: createAgent
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CreateAgentRequest'}}}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Agent'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
  /delegations:
    post:
      tags: [Delegations]
      operationId: createDelegation
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CreateDelegationRequest'}}}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Delegation'}}}}
  /wallets:
    post:
      tags: [Wallets]
      operationId: createWallet
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CreateWalletRequest'}}}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Wallet'}}}}
  /wallets/{walletId}/fund:
    post:
      tags: [Wallets]
      operationId: fundWallet
      parameters: [{$ref: '#/components/parameters/WalletId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/Money'}}}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Transaction'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
  /policies:
    post:
      tags: [Policies]
      operationId: createPolicy
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CreatePolicyRequest'}}}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Policy'}}}}
  /payments:
    post:
      tags: [Payments]
      operationId: createPayment
      description: Creates a PaymentRequest. The caller must be authenticated and bound server-side to the claimed agent_id. Agent-Pay evaluates delegation, policy, budget and approval before execution.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/CorrelationId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CreatePaymentRequest'}}}
      responses:
        '201': {description: Accepted, content: {application/json: {schema: {$ref: '#/components/schemas/Payment'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /payments/{paymentId}:
    get:
      tags: [Payments]
      operationId: getPayment
      parameters: [{$ref: '#/components/parameters/PaymentId'}]
      responses:
        '200': {description: Payment state, content: {application/json: {schema: {$ref: '#/components/schemas/Payment'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
  /payments/{paymentId}/cancel:
    post:
      tags: [Payments]
      operationId: cancelPayment
      parameters: [{$ref: '#/components/parameters/PaymentId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '200': {description: Cancelled, content: {application/json: {schema: {$ref: '#/components/schemas/Payment'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
  /approvals/{approvalId}/approve:
    post:
      tags: [Approvals]
      operationId: approvePayment
      parameters: [{$ref: '#/components/parameters/ApprovalId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        content: {application/json: {schema: {$ref: '#/components/schemas/ApprovalDecisionRequest'}}}
      responses:
        '200': {description: Approved, content: {application/json: {schema: {$ref: '#/components/schemas/Approval'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
  /approvals/{approvalId}/deny:
    post:
      tags: [Approvals]
      operationId: denyPayment
      parameters: [{$ref: '#/components/parameters/ApprovalId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        content: {application/json: {schema: {$ref: '#/components/schemas/ApprovalDecisionRequest'}}}
      responses:
        '200': {description: Denied, content: {application/json: {schema: {$ref: '#/components/schemas/Approval'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
  /transactions/{transactionId}:
    get:
      tags: [Transactions]
      operationId: getTransaction
      parameters: [{$ref: '#/components/parameters/TransactionId'}]
      responses:
        '200': {description: Transaction, content: {application/json: {schema: {$ref: '#/components/schemas/Transaction'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
components:
  securitySchemes:
    agentBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived, scoped, audience-bound credential. Server must bind the authenticated caller to the claimed agent identity.
  parameters:
    WalletId: {name: walletId, in: path, required: true, schema: {type: string}}
    PaymentId: {name: paymentId, in: path, required: true, schema: {type: string}}
    ApprovalId: {name: approvalId, in: path, required: true, schema: {type: string}}
    TransactionId: {name: transactionId, in: path, required: true, schema: {type: string}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 8, maxLength: 255}}
    CorrelationId: {name: X-Correlation-Id, in: header, required: false, schema: {type: string, maxLength: 255}}
  responses:
    BadRequest: {description: Invalid request, content: {application/problem+json: {schema: {$ref: '#/components/schemas/ProblemDetails'}}}}
    Unauthorized: {description: Authentication failure, content: {application/problem+json: {schema: {$ref: '#/components/schemas/ProblemDetails'}}}}
    Forbidden: {description: Financial authorization denied, content: {application/problem+json: {schema: {$ref: '#/components/schemas/ProblemDetails'}}}}
    NotFound: {description: Resource not found, content: {application/problem+json: {schema: {$ref: '#/components/schemas/ProblemDetails'}}}}
    Conflict: {description: State conflict or idempotency conflict, content: {application/problem+json: {schema: {$ref: '#/components/schemas/ProblemDetails'}}}}
  schemas:
    Money:
      type: object
      required: [value, currency]
      properties:
        value: {type: string, pattern: '^[0-9]+(\\.[0-9]{1,4})?$'}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
    Merchant:
      type: object
      required: [name]
      properties:
        name: {type: string}
        domain: {type: string}
        category: {type: string}
        country: {type: string}
        merchant_reference: {type: string}
    CommerceContext:
      type: object
      properties:
        order_id: {type: string}
        cart_id: {type: string}
        checkout_session_id: {type: string}
        merchant_order_reference: {type: string}
        protocol: {type: string}
        metadata: {type: object, additionalProperties: true}
    AuthorizationEvidence:
      type: object
      properties:
        evidence_id: {type: string}
        issuer: {type: string}
        evidence_type: {type: string}
        digest: {type: string}
        issued_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        source_reference: {type: string}
    CreateAgentRequest:
      type: object
      required: [account_id, name]
      properties:
        account_id: {type: string}
        name: {type: string}
        identity_reference: {type: string}
    Agent:
      allOf:
        - {$ref: '#/components/schemas/CreateAgentRequest'}
        - type: object
          required: [id, status]
          properties:
            id: {type: string}
            status: {type: string, enum: [ACTIVE, SUSPENDED, REVOKED]}
    CreateDelegationRequest:
      type: object
      required: [account_id, agent_id]
      properties:
        account_id: {type: string}
        agent_id: {type: string}
        scope: {type: array, items: {type: string}}
        constraints: {type: object, additionalProperties: true}
        valid_from: {type: string, format: date-time}
        valid_until: {type: string, format: date-time}
    Delegation:
      allOf:
        - {$ref: '#/components/schemas/CreateDelegationRequest'}
        - type: object
          required: [id, status]
          properties:
            id: {type: string}
            status: {type: string, enum: [ACTIVE, SUSPENDED, REVOKED, EXPIRED]}
    CreateWalletRequest:
      type: object
      required: [account_id, currency]
      properties:
        account_id: {type: string}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
    Wallet:
      allOf:
        - {$ref: '#/components/schemas/CreateWalletRequest'}
        - type: object
          required: [id, balance, available_balance, status]
          properties:
            id: {type: string}
            balance: {$ref: '#/components/schemas/Money'}
            available_balance: {$ref: '#/components/schemas/Money'}
            status: {type: string, enum: [ACTIVE, SUSPENDED, CLOSED]}
    CreatePolicyRequest:
      type: object
      required: [account_id, name]
      properties:
        account_id: {type: string}
        name: {type: string}
        rules: {type: object, additionalProperties: true}
    Policy:
      type: object
      required: [id, account_id, name, status]
      properties:
        id: {type: string}
        account_id: {type: string}
        name: {type: string}
        status: {type: string, enum: [ACTIVE, INACTIVE]}
        current_version_id: {type: string}
    PaymentItem:
      type: object
      required: [name, quantity, unit_price]
      properties:
        name: {type: string}
        quantity: {type: integer, minimum: 1}
        unit_price: {$ref: '#/components/schemas/Money'}
    CreatePaymentRequest:
      type: object
      required: [agent_id, account_id, merchant, amount, purpose]
      properties:
        agent_id: {type: string}
        account_id: {type: string}
        merchant: {$ref: '#/components/schemas/Merchant'}
        amount: {$ref: '#/components/schemas/Money'}
        purpose: {type: string}
        items: {type: array, items: {$ref: '#/components/schemas/PaymentItem'}}
        commerce_context: {$ref: '#/components/schemas/CommerceContext'}
        authorization_evidence: {$ref: '#/components/schemas/AuthorizationEvidence'}
        preferred_instrument_id: {type: string}
    Payment:
      type: object
      required: [id, status, amount, currency, agent_id, account_id]
      properties:
        id: {type: string}
        status:
          type: string
          enum: [REQUESTED, VALIDATING, AUTHENTICATION_REQUIRED, AUTHENTICATED, POLICY_CHECK, BUDGET_CHECK, APPROVAL_REQUIRED, APPROVED, PAYMENT_PENDING, PROCESSING, UNKNOWN_EXTERNAL_OUTCOME, SUCCEEDED, FAILED, CANCELLED, REFUND_REQUESTED, REFUND_PROCESSING, REFUNDED, REFUND_FAILED, VOID_REQUESTED, VOIDED, VOID_FAILED, SETTLEMENT_PENDING, SETTLED, SETTLEMENT_FAILED, DISPUTED, CHARGEBACK]
        agent_id: {type: string}
        account_id: {type: string}
        amount: {type: string}
        currency: {type: string}
        approval_id: {type: string, nullable: true}
        budget_reservation_id: {type: string, nullable: true}
        policy_version_id: {type: string, nullable: true}
        authorization_evidence_id: {type: string, nullable: true}
        provider_operation_id: {type: string, nullable: true}
        provider_reference: {type: string, nullable: true}
        authentication: {$ref: '#/components/schemas/PaymentAuthentication'}
        next_action: {$ref: '#/components/schemas/NextAction'}
    PaymentAuthentication:
      type: object
      nullable: true
      properties:
        status: {type: string, enum: [NOT_REQUIRED, REQUIRED, PENDING, AUTHENTICATED, FAILED, EXPIRED]}
        method: {type: string}
        provider_reference: {type: string}
        expires_at: {type: string, format: date-time}
    NextAction:
      type: object
      properties:
        type: {type: string, enum: [APPROVAL, PAYMENT_AUTHENTICATION, REDIRECT, NONE]}
        url: {type: string, format: uri}
        expires_at: {type: string, format: date-time}
    ApprovalDecisionRequest:
      type: object
      properties:
        reason: {type: string}
        intent_digest: {type: string}
    Approval:
      type: object
      required: [id, payment_request_id, status]
      properties:
        id: {type: string}
        payment_request_id: {type: string}
        status: {type: string, enum: [PENDING, APPROVED, DENIED, EXPIRED, CANCELLED]}
        requested_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        decided_at: {type: string, format: date-time}
        decided_by: {type: string}
        intent_digest: {type: string}
        reason: {type: string}
    Transaction:
      type: object
      required: [id, type, status, amount, currency]
      properties:
        id: {type: string}
        payment_id: {type: string, nullable: true}
        type: {type: string, enum: [FUNDING, PAYMENT, HOLD, RELEASE, REFUND, REVERSAL, ADJUSTMENT, FEE]}
        status: {type: string, enum: [PENDING, POSTED, FAILED, REVERSED]}
        amount: {type: string}
        currency: {type: string}
        created_at: {type: string, format: date-time}
    ProblemDetails:
      type: object
      required: [type, title, status]
      properties:
        type: {type: string, format: uri}
        title: {type: string}
        status: {type: integer, minimum: 100, maximum: 599}
        detail: {type: string}
        instance: {type: string}
        code: {type: string}
        correlation_id: {type: string}
        retryable: {type: boolean}
