name: Agent-Pay Docker Clean Start

on:
  push:
    branches: [main]
  pull_request:

jobs:
  docker-clean-start:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and start clean stack
        working-directory: reference/implementation
        run: docker compose up -d --build

      - name: Wait for API health
        working-directory: reference/implementation
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8000/healthz; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color api postgres worker
          exit 1

      - name: Verify required persistence tables
        working-directory: reference/implementation
        run: |
          docker compose exec -T postgres psql -U postgres -d agent_pay -v ON_ERROR_STOP=1 -c "SELECT count(*) = 11 AS required_tables_present FROM information_schema.tables WHERE table_schema='public' AND table_name IN ('authorization_evidence','policy_versions','budget_reservations','payment_authentications','provider_operations','provider_events','settlements','reconciliation_records','outbox_events','ledger_journals','ledger_postings');" | grep -q t

      - name: Verify worker is running
        working-directory: reference/implementation
        run: |
          docker compose ps --status running | grep -q 'worker'

      - name: Show clean-start state
        if: always()
        working-directory: reference/implementation
        run: docker compose ps

      - name: Tear down cleanly
        if: always()
        working-directory: reference/implementation
        run: docker compose down -v
