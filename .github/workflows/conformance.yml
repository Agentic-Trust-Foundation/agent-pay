name: Agent-Pay Conformance

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  conformance:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: reference/implementation
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install implementation test dependencies
        run: pip install -e '.[test]'
      - name: Run V1 conformance suite
        run: pytest -q -m conformance
      - name: Check ATF-Agent-Pay cross-repository contract
        working-directory: .
        run: python tools/check_cross_repo_conformance.py
