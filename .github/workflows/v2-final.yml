name: Agent-Pay V2 Final

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  final:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate JSON contracts
        run: python3 -m json.tool conformance/v2/phase-43/contract.json >/dev/null
      - name: Run Phase 43 tests
        run: python3 -m unittest discover -s tests/v2 -p 'test_phase_43_final.py'
      - name: Run V2 final contract runner
        run: python3 tools/v2_phase_contract_runner.py
      - name: Run ATF cross-repository verification
        run: python3 tools/v2_final_cross_repo.py
      - uses: actions/setup-go@v7
        with:
          go-version: "1.22"
      - name: Fetch pinned ATF V2 Go verifier
        run: |
          rm -rf /tmp/agentic-trust
          git init /tmp/agentic-trust
          git -C /tmp/agentic-trust remote add origin https://github.com/Agentic-Trust-Foundation/agentic-trust.git
          git -C /tmp/agentic-trust fetch --depth 1 origin 635dae5cff945a88d1629e8ae20feffff10fe11e
          git -C /tmp/agentic-trust checkout --detach FETCH_HEAD
      - name: Run pinned ATF independent Go verifier
        working-directory: /tmp/agentic-trust/reference/implementation/go/v2-final-conformance
        run: go run .
