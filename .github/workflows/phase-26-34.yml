name: Agent-Pay V2 Phases 26-34
permissions:
  contents: read
on:
  push:
    branches: [main]
    paths: ["docs/v2/phase-26-34-v2-foundation.md","conformance/v2/phase-26-34-**","tools/check_v2_phase_26_34.py",".github/workflows/phase-26-34.yml"]
  pull_request:
    paths: ["docs/v2/phase-26-34-v2-foundation.md","conformance/v2/phase-26-34-**","tools/check_v2_phase_26_34.py",".github/workflows/phase-26-34.yml"]
jobs:
  conformance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - run: python -m pip install pyyaml
      - run: python tools/check_v2_phase_26_34.py
