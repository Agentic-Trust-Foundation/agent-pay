name: Bug report
description: Report a reproducible defect in Agent-Pay
title: "Bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        For undisclosed security vulnerabilities, do not use this form. Follow SECURITY.md instead.
  - type: input
    id: component
    attributes:
      label: Component
      description: Identify the affected implementation, protocol artifact, workflow, or documentation.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest reproducible example, command, vector, or request.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: Include correctness, security, financial-state, compatibility, or operational impact.
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit or version
    validations:
      required: true
