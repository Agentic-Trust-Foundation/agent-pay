version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /reference/implementation
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      python-runtime:
        patterns:
          - "*"
